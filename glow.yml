# Bu checkout icin eksiksiz Glow config'i.
# Kullanmak icin:
#   GLOW_CONFIG_HOME=/mnt/samsung/orion-backup-local/projects/glow ./glow README.md

# Markdown stil adi veya JSON stil dosyasi yolu.
# En iyi genel gorunum: goz yormayan ozel stil dosyasi.
style: "/mnt/samsung/orion-backup-local/projects/glow/myconfig/goz-yormayan.json"

# CLI pager modu. Uzun dokumanlarda komutta `-p` kullanmak daha kontrollu.
pager: false

# Interaktif TUI modu. pager ile ayni anda true olamaz.
tui: false

# Genel okuma icin dengeli genislik: kod icin yeterli, prose icin cok yayvan degil.
width: 100

# TUI: mouse/tekerlek destegi. CLI/URL render akisini etkilemez.
mouse: true

# TUI: gizli/ignored dosyalari varsayilan olarak sakla.
# Her seyi gormek gerektiginde komutta `-a` kullan.
all: false

# TUI: proje dokumani okurken satir referansi goster.
showLineNumbers: true

# Markdown'daki yazilmis satir sonlarini koru.
preserveNewLines: true

# Kitty terminalde CLI markdown image satirlarini inline gostermeyi dene.
# Kitty degilse veya desteklenmeyen kaynakta normal render'a geri doner.
kittyImages: true
